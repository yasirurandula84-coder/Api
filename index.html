<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTER V2 | NEURAL SPAM SYSTEM</title>
    <style>
        :root {
            --primary: #00ff41; /* Classic Matrix Green */
            --bg: #050505;
            --accent: #ff003c; /* Cyberpunk Red */
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Matrix Rain Background Effect */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--primary);
            padding: 40px;
            box-shadow: 0 0 20px var(--primary), inset 0 0 10px var(--primary);
            width: 450px;
            text-align: center;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 2px 2px var(--accent);
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .input-group {
            margin: 20px 0;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--primary);
            padding: 12px;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            box-shadow: 0 0 10px var(--primary);
        }

        .launch-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .launch-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        #terminal {
            height: 100px;
            background: rgba(0, 20, 0, 0.5);
            margin-top: 20px;
            padding: 10px;
            font-size: 0.7rem;
            text-align: left;
            overflow-y: hidden;
            border-top: 1px solid var(--primary);
        }

        .status-line {
            margin: 2px 0;
            border-right: 2px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2s steps(40, end) forwards;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>DEXTER V2.0</h1>
        <p style="font-size: 0.8rem; color: #888;">[ SYSTEM STATUS: READY ]</p>
        
        <div class="input-group">
            <label>> TARGET_IDENTIFIER_UNIT</label>
            <input type="text" id="target" placeholder="947xxxxxxxx" autocomplete="off">
        </div>

        <div class="input-group">
            <label>> INJECTION_LOAD_COUNT</label>
            <input type="number" id="count" value="10" max="100">
        </div>

        <button class="launch-btn" onclick="executeAttack()">Execute Neural Link</button>

        <div id="terminal">
            <div id="logs"></div>
        </div>
    </div>

    <script>
        // Matrix Effect Logic
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Terminal Logging Logic
        function addLog(text) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'status-line';
            div.innerText = `[LOG] > ${text}`;
            logs.prepend(div);
        }

        function executeAttack() {
            const num = document.getElementById('target').value;
            const cnt = document.getElementById('count').value;

            if(!num) {
                addLog("CRITICAL ERROR: NO TARGET DEFINED");
                return;
            }

            addLog("INITIALIZING VEXTER NEURAL LINK...");
            addLog(`TARGET LOCKED: ${num}`);
            addLog("BYPASSING WHATSAPP RATE LIMITS...");

            fetch(`/attack?num=${num}&count=${cnt}`)
                .then(res => res.json())
                .then(data => {
                    addLog("ATTACK PAYLOAD DISPATCHED SUCCESSFULLY!");
                    addLog("WAITING FOR TARGET RESPONSE...");
                })
                .catch(err => {
                    addLog("ERROR: CONNECTION REFUSED BY SERVER");
                });
        }
    </script>
</body>
</html>
