<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEXTER V2 | NEURAL INJECTION</title>
    <style>
        :root { --p: #00ff41; --bg: #050505; --a: #ff003c; }
        body { background: var(--bg); color: var(--p); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; z-index: -1; }
        .panel { background: rgba(0,0,0,0.9); border: 1px solid var(--p); padding: 30px; width: 420px; text-align: center; box-shadow: 0 0 20px var(--p); position: relative; }
        h1 { letter-spacing: 5px; text-shadow: 2px 2px var(--a); margin-bottom: 20px; font-size: 1.8rem; animation: g 1s infinite; }
        @keyframes g { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        input { width: 100%; background: #000; border: 1px solid var(--p); padding: 12px; color: var(--p); margin: 10px 0; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: transparent; color: var(--p); border: 1px solid var(--p); cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        button:hover { background: var(--p); color: #000; box-shadow: 0 0 30px var(--p); }
        #logs { height: 150px; background: rgba(0,20,0,0.8); margin-top: 20px; border: 1px solid #004400; padding: 10px; font-size: 11px; text-align: left; overflow-y: auto; color: #0f0; }
        .line { margin-bottom: 4px; border-left: 2px solid var(--a); padding-left: 5px; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>
    <div class="panel">
        <h1>RANU V1.0</h1>
        <p style="font-size: 10px; color: #888;">NEURAL SYSTEM ONLINE</p>
        <input type="text" id="num" placeholder="TARGET: 947xxxxxxxx">
        <input type="number" id="cnt" value="10" placeholder="ATTACK COUNT">
        <button onclick="run()">EXECUTE NEURAL LINK</button>
        <div id="logs"><div id="inner"></div></div>
    </div>

    <script>
        // Matrix Background
        const c = document.getElementById('m'), x = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const s = "010101", f = 16, cl = c.width/f, d = [];
        for(let i=0; i<cl; i++) d[i] = 1;
        function draw() {
            x.fillStyle = "rgba(0,0,0,0.05)"; x.fillRect(0,0,c.width,c.height);
            x.fillStyle = "#00ff41"; x.font = f+"px arial";
            for(let i=0; i<d.length; i++) {
                x.fillText(s[Math.floor(Math.random()*s.length)], i*f, d[i]*f);
                if(d[i]*f > c.height && Math.random() > 0.975) d[i] = 0;
                d[i]++;
            }
        }
        setInterval(draw, 35);

        function addLog(msg) {
            const inner = document.getElementById('inner');
            const div = document.createElement('div');
            div.className = 'line';
            div.innerText = `[${new Date().toLocaleTimeString()}] > ${msg}`;
            inner.prepend(div);
        }

        // ප්‍රධාන Attack Logic එක
        async function run() {
            const target = document.getElementById('num').value;
            const count = document.getElementById('cnt').value;

            if(!target) return addLog("CRITICAL ERROR: NO TARGET");

            addLog(`INITIALIZING LINK ON: ${target}`);

            for(let i = 0; i < count; i++) {
                addLog(`SENDING PAYLOAD ${i+1}/${count}...`);
                
                try {
                    // සර්වර් එකට රික්වෙස්ට් එක යවනවා
                    const response = await fetch(`/attack?num=${target}`);
                    const data = await response.json();
                    
                    if(data.success) {
                        addLog(`SUCCESS: PAYLOAD ${i+1} DELIVERED`);
                    } else {
                        addLog(`FAILED: CONNECTION RESET BY PEER`);
                    }
                } catch(e) {
                    addLog(`ERROR: NEURAL LINK INTERRUPTED`);
                }

                // තත්පර 12ක පරතරයක් (WhatsApp බ්ලොක් නොවී දිගටම යන්න)
                if(i < count - 1) {
                    addLog("WAITING FOR NEXT INJECTION...");
                    await new Promise(res => setTimeout(res, 12000));
                }
            }
            addLog("MISSION ACCOMPLISHED: TARGET SYSTEM OVERLOADED.");
        }
    </script>
</body>
</html>
